name: Connector B occupancy SAT certificates

on:
  workflow_dispatch:

concurrency:
  group: research-archive-replay
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'CrocSwap/integer-mult-bounds'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install the pinned proposal solver
        run: python -m pip install 'python-sat==1.8.dev24'
      - name: Check fresh certificates and semantic controls
        env:
          CC: gcc
          TMPDIR: ${{ runner.temp }}
        run: |
          python -I -Werror -B research/connector-b-occupancy-sat/verify.py --controls
          python -I -Werror -B research/connector-b-occupancy-sat/test_model.py
          python -I -O -Werror -B research/connector-b-occupancy-sat/test_model.py
