name: v4-plane-lb
on:
  workflow_dispatch:
jobs:
  cg:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numpy / scipy
        run: pip install numpy==2.2.6 scipy==1.18.1
      - name: Cutting-plane LP + exhaustive separation + strict certificate (resumes from v4_cg2_state.pkl)
        env:
          V4_TIME_LIMIT_SEC: '19800'
        run: python -u v4_cg2.py 2>&1 | tee v4_cg2.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-plane-lb-result
          path: |
            v4_cg2.log
            v4_cg2.progress.json
            v4_cg2_result.json
            v4_cg2_state.pkl
            v4_cg2_lam_last.npy
