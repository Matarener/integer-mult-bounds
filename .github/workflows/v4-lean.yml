name: v4-lean
on:
  push:
    branches: [v4-plane-lb]
    paths: ['lean/**', .github/workflows/v4-lean.yml]
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LEAN_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - name: Checksum-pinned official Lean v4.21.0 (same as the repo's Lean workflows)
        run: |
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.21.0/lean-4.21.0-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          echo "455c6df09d5bd54d2a51b137939c47e2dda816d512ac789c4b3642c9bf98bde8  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.21.0-linux/bin" >> "$GITHUB_PATH"
      - name: Mathlib cache (pinned rev 308445d)
        working-directory: lean
        run: lake exe cache get
      - name: Kernel-check proofs; reject sorry and non-standard axioms
        working-directory: lean
        run: |
          set -o pipefail
          lake env lean -DwarningAsError=true V4Duality.lean 2>&1 | tee lean.out
          if grep -q "sorry" lean.out; then echo "sorry found"; exit 1; fi
          n=$(grep -c "depends on axioms" lean.out); [ "$n" = "2" ] || { echo "expected 2 axiom reports, got $n"; exit 1; }
          if grep "depends on axioms" lean.out | grep -v -E "^'[^']+' depends on axioms: \[(propext|Classical.choice|Quot.sound)(, (propext|Classical.choice|Quot.sound))*\]$"; then echo "unexpected axioms"; exit 1; fi
          echo "ALL LEAN CHECKS PASSED"
